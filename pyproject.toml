[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tubelens"
version = "1.2.0"
description = "YouTube AI search visibility + affiliate audit + anahtarsiz video uretim kiti"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["youtube", "seo", "ai-visibility", "affiliate", "video-generator", "tts"]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "edge-tts>=7.2",
    "imageio-ffmpeg>=0.6",
    "Pillow>=10",
    "gTTS>=2.5",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tubelens = "tubelens.cli:main_cli"

[project.urls]
Homepage = "https://github.com/RetroNyym/tubelens"
Issues = "https://github.com/RetroNyym/tubelens/issues"

[tool.setuptools.packages.find]
include = ["tubelens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
