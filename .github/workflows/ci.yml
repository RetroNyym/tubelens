name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Kurulum
        run: python -m pip install --retries 10 --timeout 60 -e ".[dev]"
      - name: Surum
        run: python -m tubelens --version
      - name: Testler
        run: python -m pytest -q
